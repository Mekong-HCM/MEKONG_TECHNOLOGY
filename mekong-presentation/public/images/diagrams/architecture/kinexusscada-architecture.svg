  <text x="65" y="505" class="label-sm">• S7-1200</text>
  <text x="65" y="518" class="label-sm">• S7-1500</text>
  <text x="65" y="531" class="label-sm">• ET200</text>
  
  <rect x="150" y="475" width="85" height="60" rx="4" class="module" filter="url(#shadow)"/>
  <rect x="150" y="475" width="85" height="15" rx="4" fill="#2196F3"/>  
  <text x="192" y="487" text-anchor="middle" class="label-white" font-size="7">Schneider</text>
  <text x="160" y="505" class="label-sm">• M340</text>
  <text x="160" y="518" class="label-sm">• M580</text>
  <text x="160" y="531" class="label-sm">• Quantum</text>
  
  <rect x="55" y="545" width="180" height="55" rx="4" class="module" filter="url(#shadow)"/>
  <rect x="55" y="545" width="180" height="15" rx="4" fill="#2196F3"/>
  <text x="145" y="557" text-anchor="middle" class="label-white" font-size="7">Other PLCs</text>
  <text x="65" y="575" class="label-sm">Allen-Bradley, Mitsubishi, Omron, Delta</text>
  <text x="65" y="590" class="label-sm">ABB, Beckhoff, Keyence</text>
  
  <!-- KINEXUS Gateway Section -->
  <rect x="260" y="445" width="200" height="170" rx="6" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1"/>
  <rect x="260" y="445" width="200" height="20" rx="6" class="scada-green"/>
