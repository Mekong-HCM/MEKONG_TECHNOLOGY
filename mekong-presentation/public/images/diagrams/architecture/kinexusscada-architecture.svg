  <!-- Protocols -->
  <rect x="50" y="355" width="90" height="25" rx="4" fill="#FF9800"/>
  <text x="95" y="372" text-anchor="middle" class="label-white" font-size="9">OPC UA</text>
  
  <rect x="155" y="355" width="90" height="25" rx="4" fill="#FF9800"/>
  <text x="200" y="372" text-anchor="middle" class="label-white" font-size="9">Modbus TCP</text>
  
  <rect x="260" y="355" width="90" height="25" rx="4" fill="#FF9800"/>
  <text x="305" y="372" text-anchor="middle" class="label-white" font-size="9">Modbus RTU</text>
  
  <rect x="365" y="355" width="90" height="25" rx="4" fill="#FF9800"/>
  <text x="410" y="372" text-anchor="middle" class="label-white" font-size="9">BACnet</text>
  
  <rect x="470" y="355" width="90" height="25" rx="4" fill="#FF9800"/>
  <text x="515" y="372" text-anchor="middle" class="label-white" font-size="9">MQTT</text>
  
  <rect x="575" y="355" width="90" height="25" rx="4" fill="#FF9800"/>
  <text x="620" y="372" text-anchor="middle" class="label-white" font-size="9">S7 Siemens</text>
  
  <rect x="680" y="355" width="90" height="25" rx="4" fill="#FF9800"/>
  <text x="725" y="372" text-anchor="middle" class="label-white" font-size="9">EtherNet/IP</text>
  
  <rect x="785" y="355" width="70" height="25" rx="4" fill="#FF9800"/>
  <text x="820" y="372" text-anchor="middle" class="label-white" font-size="9">IEC 104</text>
  
  <!-- ============ FIELD DEVICES ============ -->
  <rect x="30" y="410" width="840" height="220" rx="8" class="box-light" filter="url(#shadow)"/>
  <rect x="30" y="410" width="840" height="25" rx="8" class="box-primary"/>
  <rect x="30" y="430" width="840" height="5" class="box-primary"/>
