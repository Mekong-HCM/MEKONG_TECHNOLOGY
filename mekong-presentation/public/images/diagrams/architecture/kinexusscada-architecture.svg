  <rect x="45" y="445" width="200" height="20" rx="6" class="scada-blue"/>
  <text x="145" y="460" text-anchor="middle" class="label-white" font-size="10">PLC / RTU</text>
  
  <rect x="55" y="475" width="85" height="60" rx="4" class="module" filter="url(#shadow)"/>
  <rect x="55" y="475" width="85" height="15" rx="4" fill="#2196F3"/>
