  <text x="280" y="505" class="label-sm">• 4×RS-485</text>
  <text x="280" y="518" class="label-sm">• WiFi/4G</text>
  <text x="280" y="531" class="label-sm">• Basic IoT</text>
  
  <rect x="365" y="475" width="85" height="60" rx="4" class="module" filter="url(#shadow)"/>
  <rect x="365" y="475" width="85" height="15" rx="4" fill="#4CAF50"/>
  <text x="407" y="487" text-anchor="middle" class="label-white" font-size="7">KX-200</text>
  <text x="375" y="505" class="label-sm">• 2 TOPS AI</text>
  <text x="375" y="518" class="label-sm">• 4G/WiFi 6</text>
  <text x="375" y="531" class="label-sm">• Edge ML</text>
  
  <rect x="270" y="545" width="85" height="55" rx="4" class="module" filter="url(#shadow)"/>
  <rect x="270" y="545" width="85" height="15" rx="4" fill="#4CAF50"/>
  <text x="312" y="557" text-anchor="middle" class="label-white" font-size="7">KX-300</text>
  <text x="280" y="575" class="label-sm">• 40 TOPS</text>
  <text x="280" y="590" class="label-sm">• 5G Ready</text>
  
  <rect x="365" y="545" width="85" height="55" rx="4" class="module" filter="url(#shadow)"/>
  <rect x="365" y="545" width="85" height="15" rx="4" fill="#4CAF50"/>
  <text x="407" y="557" text-anchor="middle" class="label-white" font-size="7">KX-500</text>
  <text x="375" y="575" class="label-sm">• 200 TOPS</text>
  <text x="375" y="590" class="label-sm">• Industrial AI</text>
  
  <!-- BMS/DDC Section -->
  <rect x="475" y="445" width="185" height="170" rx="6" fill="#FFF3E0" stroke="#FF9800" stroke-width="1"/>
  <rect x="475" y="445" width="185" height="20" rx="6" class="scada-orange"/>
  <text x="567" y="460" text-anchor="middle" class="label-white" font-size="10">BMS CONTROLLERS</text>
  
  <rect x="485" y="475" width="80" height="55" rx="4" class="module" filter="url(#shadow)"/>
  <rect x="485" y="475" width="80" height="15" rx="4" fill="#FF9800"/>
  <text x="525" y="487" text-anchor="middle" class="label-white" font-size="7">DDC-24</text>
  <text x="495" y="505" class="label-sm">• 24 I/O</text>
  <text x="495" y="520" class="label-sm">• Small AHU</text>
  
  <rect x="570" y="475" width="80" height="55" rx="4" class="module" filter="url(#shadow)"/>
  <rect x="570" y="475" width="80" height="15" rx="4" fill="#FF9800"/>
  <text x="610" y="487" text-anchor="middle" class="label-white" font-size="7">DDC-64</text>
  <text x="580" y="505" class="label-sm">• 64 I/O</text>
  <text x="580" y="520" class="label-sm">• Chiller</text>
  
  <rect x="485" y="540" width="165" height="65" rx="4" class="module" filter="url(#shadow)"/>
  <rect x="485" y="540" width="165" height="15" rx="4" fill="#FF9800"/>
  <text x="567" y="552" text-anchor="middle" class="label-white" font-size="7">I/O EXPANSION</text>
  <text x="495" y="572" class="label-sm">• KX-EIO-UI8: Universal Input</text>
  <text x="495" y="587" class="label-sm">• KX-EIO-DO8: Relay Output</text>
  <text x="495" y="602" class="label-sm">• KX-EIO-AO4: Analog Output</text>
  
  <!-- Sensors Section -->
  <rect x="675" y="445" width="180" height="170" rx="6" fill="#F3E5F5" stroke="#9C27B0" stroke-width="1"/>
  <rect x="675" y="445" width="180" height="20" rx="6" class="scada-purple"/>
  <text x="765" y="460" text-anchor="middle" class="label-white" font-size="10">FIELD SENSORS</text>
  
  <text x="685" y="480" class="label-sm" font-weight="bold">Temperature:</text>
  <text x="775" y="480" class="label-sm">PT100, NTC, Thermocouple</text>
  
  <text x="685" y="498" class="label-sm" font-weight="bold">Pressure:</text>
  <text x="775" y="498" class="label-sm">0-10V, 4-20mA</text>
  
  <text x="685" y="516" class="label-sm" font-weight="bold">Flow:</text>
  <text x="775" y="516" class="label-sm">Ultrasonic, Magnetic</text>
  
  <text x="685" y="534" class="label-sm" font-weight="bold">Level:</text>
  <text x="775" y="534" class="label-sm">Capacitive, Radar</text>
  
  <text x="685" y="552" class="label-sm" font-weight="bold">Power:</text>
  <text x="775" y="552" class="label-sm">3-phase Meter</text>
  
  <text x="685" y="570" class="label-sm" font-weight="bold">Environment:</text>
  <text x="775" y="570" class="label-sm">CO2, Humidity, Air</text>
  
  <text x="685" y="588" class="label-sm" font-weight="bold">Motion:</text>
  <text x="775" y="588" class="label-sm">Vibration, Proximity</text>
  
  <text x="685" y="606" class="label-sm" font-weight="bold">Vision:</text>
  <text x="775" y="606" class="label-sm">IP Camera, AI Box</text>
  
  <!-- Vertical Connectors -->
  <line x1="110" y1="150" x2="110" y2="175" class="connector"/>
  <line x1="255" y1="150" x2="255" y2="175" class="connector"/>
  <line x1="400" y1="150" x2="400" y2="175" class="connector"/>
  <line x1="545" y1="150" x2="545" y2="175" class="connector"/>
  <line x1="690" y1="150" x2="690" y2="175" class="connector"/>
  
  <line x1="122" y1="295" x2="122" y2="320" class="connector"/>
  <line x1="292" y1="295" x2="292" y2="320" class="connector"/>
  <line x1="462" y1="295" x2="462" y2="320" class="connector"/>
  <line x1="632" y1="295" x2="632" y2="320" class="connector"/>
  
  <line x1="145" y1="390" x2="145" y2="445" class="connector"/>
  <line x1="360" y1="390" x2="360" y2="445" class="connector"/>
  <line x1="567" y1="390" x2="567" y2="445" class="connector"/>
  <line x1="765" y1="390" x2="765" y2="445" class="connector"/>
  
</svg>