<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #0A2240; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #555; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #333; }
      .label-white { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #FFF; }
      .label-sm { font-family: 'Segoe UI', Arial, sans-serif; font-size: 9px; fill: #666; }
      .box-primary { fill: #0A2240; }
      .box-accent { fill: #FF6B00; }
      .box-light { fill: #E8EDF2; stroke: #B8C4D0; stroke-width: 1; }
      .module { fill: #FFFFFF; stroke: #D0D8E0; stroke-width: 1.5; }
      .scada-green { fill: #4CAF50; }
      .scada-blue { fill: #2196F3; }
      .scada-orange { fill: #FF9800; }
      .scada-purple { fill: #9C27B0; }
      .connector { stroke: #0A2240; stroke-width: 2; fill: none; }
      .connector-data { stroke: #FF6B00; stroke-width: 2; fill: none; stroke-dasharray: 6,3; }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FAFBFC"/>
      <stop offset="100%" style="stop-color:#EEF1F5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0A2240"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FF6B00"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="650" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" class="title">KinexusSCADA PLATFORM ARCHITECTURE</text>
  <text x="450" y="50" text-anchor="middle" class="subtitle">Industrial IoT Supervisory Control and Data Acquisition System</text>
  
  <!-- ============ VISUALIZATION LAYER ============ -->
  <rect x="30" y="70" width="840" height="90" rx="8" class="box-light" filter="url(#shadow)"/>
  <rect x="30" y="70" width="840" height="25" rx="8" class="scada-purple"/>
  <rect x="30" y="90" width="840" height="5" class="scada-purple"/>
  <text x="450" y="89" text-anchor="middle" class="label-white">VISUALIZATION & HMI LAYER</text>
  
  <!-- HMI Components -->
  <rect x="45" y="105" width="130" height="45" rx="5" class="module" filter="url(#shadow)"/>
  <text x="110" y="125" text-anchor="middle" class="label">Web SCADA HMI</text>
  <text x="110" y="140" text-anchor="middle" class="label-sm">Real-time Graphics</text>
  
  <rect x="190" y="105" width="130" height="45" rx="5" class="module" filter="url(#shadow)"/>
  <text x="255" y="125" text-anchor="middle" class="label">Mobile Dashboard</text>
  <text x="255" y="140" text-anchor="middle" class="label-sm">iOS / Android</text>
  
  <rect x="335" y="105" width="130" height="45" rx="5" class="module" filter="url(#shadow)"/>
  <text x="400" y="125" text-anchor="middle" class="label">Control Room</text>
  <text x="400" y="140" text-anchor="middle" class="label-sm">Multi-monitor Wall</text>
  
  <rect x="480" y="105" width="130" height="45" rx="5" class="module" filter="url(#shadow)"/>
  <text x="545" y="125" text-anchor="middle" class="label">Alarm Console</text>
  <text x="545" y="140" text-anchor="middle" class="label-sm">Email/SMS/Push</text>
  
  <rect x="625" y="105" width="130" height="45" rx="5" class="module" filter="url(#shadow)"/>
  <text x="690" y="125" text-anchor="middle" class="label">Report Generator</text>
  <text x="690" y="140" text-anchor="middle" class="label-sm">PDF / Excel</text>
  
  <rect x="770" y="105" width="85" height="45" rx="5" class="module" filter="url(#shadow)"/>
  <text x="812" y="125" text-anchor="middle" class="label">API</text>
  <text x="812" y="140" text-anchor="middle" class="label-sm">REST/GraphQL</text>
  
  <!-- ============ APPLICATION LAYER ============ -->
  <rect x="30" y="175" width="840" height="130" rx="8" class="box-light" filter="url(#shadow)"/>
  <rect x="30" y="175" width="840" height="25" rx="8" class="scada-green"/>
  <rect x="30" y="195" width="840" height="5" class="scada-green"/>
  <text x="450" y="194" text-anchor="middle" class="label-white">APPLICATION & ANALYTICS LAYER — KinexusSCADA Core</text>
  
  <!-- Core Modules -->
  <rect x="45" y="210" width="155" height="85" rx="5" class="module" filter="url(#shadow)"/>
  <rect x="45" y="210" width="155" height="18" rx="5" fill="#66BB6A"/>
  <text x="122" y="223" text-anchor="middle" class="label-white" font-size="9">DATA HISTORIAN</text>
  <text x="55" y="245" class="label-sm">• Time-series Storage</text>
  <text x="55" y="260" class="label-sm">• Compression 10:1</text>
  <text x="55" y="275" class="label-sm">• Query Optimization</text>
  <text x="55" y="290" class="label-sm">• Retention Policy</text>
  
  <rect x="215" y="210" width="155" height="85" rx="5" class="module" filter="url(#shadow)"/>
  <rect x="215" y="210" width="155" height="18" rx="5" fill="#66BB6A"/>
  <text x="292" y="223" text-anchor="middle" class="label-white" font-size="9">ALARM MANAGER</text>
  <text x="225" y="245" class="label-sm">• Rule Engine</text>
  <text x="225" y="260" class="label-sm">• Escalation Matrix</text>
  <text x="225" y="275" class="label-sm">• Acknowledgment</text>
  <text x="225" y="290" class="label-sm">• ISA-18.2 Compliant</text>
  
  <rect x="385" y="210" width="155" height="85" rx="5" class="module" filter="url(#shadow)"/>
  <rect x="385" y="210" width="155" height="18" rx="5" fill="#66BB6A"/>
  <text x="462" y="223" text-anchor="middle" class="label-white" font-size="9">ANALYTICS ENGINE</text>
  <text x="395" y="245" class="label-sm">• Trend Analysis</text>
  <text x="395" y="260" class="label-sm">• Anomaly Detection</text>
  <text x="395" y="275" class="label-sm">• Predictive Maint.</text>
  <text x="395" y="290" class="label-sm">• Energy Optimize</text>
  
  <rect x="555" y="210" width="155" height="85" rx="5" class="module" filter="url(#shadow)"/>
  <rect x="555" y="210" width="155" height="18" rx="5" fill="#66BB6A"/>
  <text x="632" y="223" text-anchor="middle" class="label-white" font-size="9">RECIPE MANAGER</text>
  <text x="565" y="245" class="label-sm">• Batch Control</text>
  <text x="565" y="260" class="label-sm">• Parameter Sets</text>
  <text x="565" y="275" class="label-sm">• Version Control</text>
  <text x="565" y="290" class="label-sm">• ISA-88 Batch</text>
  
  <rect x="725" y="210" width="130" height="85" rx="5" class="module" filter="url(#shadow)"/>
  <rect x="725" y="210" width="130" height="18" rx="5" fill="#66BB6A"/>
  <text x="790" y="223" text-anchor="middle" class="label-white" font-size="9">SECURITY</text>
  <text x="735" y="245" class="label-sm">• Role-based Access</text>
  <text x="735" y="260" class="label-sm">• Audit Trail</text>
  <text x="735" y="275" class="label-sm">• SSL/TLS</text>
  <text x="735" y="290" class="label-sm">• IEC 62443</text>
  
  <!-- ============ COMMUNICATION LAYER ============ -->
  <rect x="30" y="320" width="840" height="70" rx="8" class="box-light" filter="url(#shadow)"/>
  <rect x="30" y="320" width="840" height="25" rx="8" class="box-accent"/>
  <rect x="30" y="340" width="840" height="5" class="box-accent"/>
