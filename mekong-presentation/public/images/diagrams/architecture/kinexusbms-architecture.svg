<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #0A2240; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #555; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #333; }
      .label-white { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #FFF; }
      .label-sm { font-family: 'Segoe UI', Arial, sans-serif; font-size: 9px; fill: #666; }
      .box-primary { fill: #0A2240; }
      .box-accent { fill: #FF6B00; }
      .box-light { fill: #E8EDF2; stroke: #B8C4D0; stroke-width: 1; }
      .box-white { fill: #FFFFFF; stroke: #D0D8E0; stroke-width: 1; }
      .module { fill: #FFFFFF; stroke: #D0D8E0; stroke-width: 1.5; }
      .api { fill: #4CAF50; }
      .database { fill: #2196F3; }
      .ui { fill: #9C27B0; }
      .service { fill: #FF9800; }
      .connector { stroke: #0A2240; stroke-width: 2; fill: none; }
      .connector-data { stroke: #FF6B00; stroke-width: 2; fill: none; stroke-dasharray: 6,3; }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FAFBFC"/>
      <stop offset="100%" style="stop-color:#EEF1F5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0A2240"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FF6B00"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="650" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" class="title">KinexusBMS SOFTWARE ARCHITECTURE</text>
  <text x="450" y="50" text-anchor="middle" class="subtitle">Building Management System — Multi-Tier Platform Architecture</text>
  
  <!-- USER INTERFACE LAYER -->
  <rect x="30" y="70" width="840" height="100" rx="8" class="box-light" filter="url(#shadow)"/>
  <rect x="30" y="70" width="840" height="28" rx="8" class="ui"/>
  <rect x="30" y="90" width="840" height="8" class="ui"/>
  <text x="450" y="90" text-anchor="middle" class="label-white">PRESENTATION LAYER — User Interfaces</text>
  
  <!-- UI Components -->
  <rect x="55" y="110" width="150" height="45" rx="5" class="module" filter="url(#shadow)"/>
  <text x="130" y="130" text-anchor="middle" class="label">Web Dashboard</text>
  <text x="130" y="145" text-anchor="middle" class="label-sm">React + TypeScript</text>
  
  <rect x="225" y="110" width="150" height="45" rx="5" class="module" filter="url(#shadow)"/>
  <text x="300" y="130" text-anchor="middle" class="label">Mobile App</text>
  <text x="300" y="145" text-anchor="middle" class="label-sm">React Native</text>
  
  <rect x="395" y="110" width="150" height="45" rx="5" class="module" filter="url(#shadow)"/>
  <text x="470" y="130" text-anchor="middle" class="label">BMS Workstation</text>
  <text x="470" y="145" text-anchor="middle" class="label-sm">Electron Desktop</text>
  
  <rect x="565" y="110" width="150" height="45" rx="5" class="module" filter="url(#shadow)"/>
  <text x="640" y="130" text-anchor="middle" class="label">3rd Party Integration</text>
  <text x="640" y="145" text-anchor="middle" class="label-sm">REST API / GraphQL</text>
  
  <rect x="735" y="110" width="120" height="45" rx="5" class="module" filter="url(#shadow)"/>
  <text x="795" y="130" text-anchor="middle" class="label">Reports</text>
  <text x="795" y="145" text-anchor="middle" class="label-sm">PDF / Excel</text>
  
