  <rect x="30" y="190" width="840" height="70" rx="8" class="box-light" filter="url(#shadow)"/>
  <rect x="30" y="190" width="840" height="25" rx="8" class="api"/>
  <rect x="30" y="210" width="840" height="5" class="api"/>
  <text x="450" y="208" text-anchor="middle" class="label-white">API GATEWAY — Security & Routing</text>
  
  <rect x="55" y="225" width="120" height="25" rx="4" fill="#81C784"/>
  <text x="115" y="242" text-anchor="middle" class="label-white" font-size="9">Authentication</text>
  
  <rect x="190" y="225" width="100" height="25" rx="4" fill="#81C784"/>
  <text x="240" y="242" text-anchor="middle" class="label-white" font-size="9">Authorization</text>
  
  <rect x="305" y="225" width="100" height="25" rx="4" fill="#81C784"/>
  <text x="355" y="242" text-anchor="middle" class="label-white" font-size="9">Rate Limiting</text>
  
  <rect x="420" y="225" width="100" height="25" rx="4" fill="#81C784"/>
  <text x="470" y="242" text-anchor="middle" class="label-white" font-size="9">Load Balance</text>
  
  <rect x="535" y="225" width="100" height="25" rx="4" fill="#81C784"/>
  <text x="585" y="242" text-anchor="middle" class="label-white" font-size="9">SSL/TLS</text>
  
  <rect x="650" y="225" width="100" height="25" rx="4" fill="#81C784"/>
  <text x="700" y="242" text-anchor="middle" class="label-white" font-size="9">WebSocket</text>
  
  <rect x="765" y="225" width="90" height="25" rx="4" fill="#81C784"/>
  <text x="810" y="242" text-anchor="middle" class="label-white" font-size="9">Logging</text>
  
  <!-- BUSINESS LOGIC LAYER -->
  <rect x="30" y="280" width="840" height="150" rx="8" class="box-light" filter="url(#shadow)"/>
  <rect x="30" y="280" width="840" height="28" rx="8" class="box-accent"/>
  <rect x="30" y="302" width="840" height="6" class="box-accent"/>
  <text x="450" y="299" text-anchor="middle" class="label-white">BUSINESS LOGIC LAYER — Core Services (Node.js / Python)</text>
  
  <!-- Microservices -->
  <rect x="45" y="320" width="130" height="95" rx="5" class="module" filter="url(#shadow)"/>
  <rect x="45" y="320" width="130" height="20" rx="5" class="service"/>
  <text x="110" y="335" text-anchor="middle" class="label-white" font-size="9">HVAC Service</text>
  <text x="60" y="355" class="label-sm">• Temperature</text>
  <text x="60" y="370" class="label-sm">• Humidity</text>
  <text x="60" y="385" class="label-sm">• Air Quality</text>
  <text x="60" y="400" class="label-sm">• Schedules</text>
  
  <rect x="190" y="320" width="130" height="95" rx="5" class="module" filter="url(#shadow)"/>
  <rect x="190" y="320" width="130" height="20" rx="5" class="service"/>
  <text x="255" y="335" text-anchor="middle" class="label-white" font-size="9">Lighting Service</text>
  <text x="205" y="355" class="label-sm">• Zones</text>
  <text x="205" y="370" class="label-sm">• Dimming</text>
  <text x="205" y="385" class="label-sm">• Occupancy</text>
  <text x="205" y="400" class="label-sm">• Daylight</text>
  
  <rect x="335" y="320" width="130" height="95" rx="5" class="module" filter="url(#shadow)"/>
  <rect x="335" y="320" width="130" height="20" rx="5" class="service"/>
  <text x="400" y="335" text-anchor="middle" class="label-white" font-size="9">Energy Service</text>
  <text x="350" y="355" class="label-sm">• Metering</text>
  <text x="350" y="370" class="label-sm">• Analytics</text>
  <text x="350" y="385" class="label-sm">• Demand</text>
  <text x="350" y="400" class="label-sm">• Cost Calc</text>
  
  <rect x="480" y="320" width="130" height="95" rx="5" class="module" filter="url(#shadow)"/>
  <rect x="480" y="320" width="130" height="20" rx="5" class="service"/>
  <text x="545" y="335" text-anchor="middle" class="label-white" font-size="9">Alarm Service</text>
  <text x="495" y="355" class="label-sm">• Detection</text>
  <text x="495" y="370" class="label-sm">• Notification</text>
  <text x="495" y="385" class="label-sm">• Escalation</text>
  <text x="495" y="400" class="label-sm">• History</text>
  
  <rect x="625" y="320" width="130" height="95" rx="5" class="module" filter="url(#shadow)"/>
  <rect x="625" y="320" width="130" height="20" rx="5" class="service"/>
  <text x="690" y="335" text-anchor="middle" class="label-white" font-size="9">Schedule Service</text>
  <text x="640" y="355" class="label-sm">• Calendar</text>
  <text x="640" y="370" class="label-sm">• Setpoints</text>
  <text x="640" y="385" class="label-sm">• Override</text>
  <text x="640" y="400" class="label-sm">• Holidays</text>
  
  <rect x="770" y="320" width="90" height="95" rx="5" class="module" filter="url(#shadow)"/>
  <rect x="770" y="320" width="90" height="20" rx="5" class="service"/>
