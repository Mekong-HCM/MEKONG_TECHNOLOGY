  <text x="785" y="355" class="label-sm">• Predict</text>
  <text x="785" y="370" class="label-sm">• Optimize</text>
  <text x="785" y="385" class="label-sm">• Anomaly</text>
  <text x="785" y="400" class="label-sm">• Insight</text>
  
  <!-- DATA LAYER -->
  <rect x="30" y="450" width="520" height="90" rx="8" class="box-light" filter="url(#shadow)"/>
  <rect x="30" y="450" width="520" height="25" rx="8" class="database"/>
  <rect x="30" y="470" width="520" height="5" class="database"/>
  <text x="290" y="468" text-anchor="middle" class="label-white">DATA LAYER — Storage & Caching</text>
  
  <rect x="45" y="485" width="100" height="45" rx="5" class="module" filter="url(#shadow)"/>
  <text x="95" y="505" text-anchor="middle" class="label">PostgreSQL</text>
  <text x="95" y="520" text-anchor="middle" class="label-sm">Config & Users</text>
  
  <rect x="160" y="485" width="100" height="45" rx="5" class="module" filter="url(#shadow)"/>
  <text x="210" y="505" text-anchor="middle" class="label">TimescaleDB</text>
  <text x="210" y="520" text-anchor="middle" class="label-sm">Time-series</text>
  
  <rect x="275" y="485" width="100" height="45" rx="5" class="module" filter="url(#shadow)"/>
  <text x="325" y="505" text-anchor="middle" class="label">Redis</text>
  <text x="325" y="520" text-anchor="middle" class="label-sm">Cache & Queue</text>
  
  <rect x="390" y="485" width="100" height="45" rx="5" class="module" filter="url(#shadow)"/>
  <text x="440" y="505" text-anchor="middle" class="label">InfluxDB</text>
  <text x="440" y="520" text-anchor="middle" class="label-sm">Metrics</text>
  
  <!-- MESSAGE BROKER -->
  <rect x="565" y="450" width="155" height="90" rx="8" class="box-light" filter="url(#shadow)"/>
  <rect x="565" y="450" width="155" height="25" rx="8" fill="#F44336"/>
  <rect x="565" y="470" width="155" height="5" fill="#F44336"/>
  <text x="642" y="468" text-anchor="middle" class="label-white">MESSAGE BROKER</text>
  
  <rect x="580" y="485" width="125" height="45" rx="5" class="module" filter="url(#shadow)"/>
  <text x="642" y="505" text-anchor="middle" class="label">RabbitMQ / MQTT</text>
  <text x="642" y="520" text-anchor="middle" class="label-sm">Event Streaming</text>
  
  <!-- DEVICE INTEGRATION -->
  <rect x="735" y="450" width="135" height="90" rx="8" class="box-light" filter="url(#shadow)"/>
  <rect x="735" y="450" width="135" height="25" rx="8" class="box-primary"/>
  <rect x="735" y="470" width="135" height="5" class="box-primary"/>
  <text x="802" y="468" text-anchor="middle" class="label-white">DEVICE DRIVERS</text>
  
  <text x="750" y="495" class="label-sm">• BACnet Driver</text>
  <text x="750" y="512" class="label-sm">• Modbus Driver</text>
  <text x="750" y="529" class="label-sm">• OPC UA Driver</text>
  
  <!-- FIELD LAYER -->
  <rect x="30" y="560" width="840" height="70" rx="8" class="box-light" filter="url(#shadow)"/>
  <rect x="30" y="560" width="840" height="25" rx="8" class="box-primary"/>
  <rect x="30" y="580" width="840" height="5" class="box-primary"/>
  <text x="450" y="578" text-anchor="middle" class="label-white">FIELD LAYER — Hardware Controllers</text>
  
  <rect x="55" y="595" width="100" height="25" rx="4" fill="#0D3A5C"/>
  <text x="105" y="612" text-anchor="middle" class="label-white" font-size="9">KX-DDC-24</text>
  
  <rect x="170" y="595" width="100" height="25" rx="4" fill="#0D3A5C"/>
  <text x="220" y="612" text-anchor="middle" class="label-white" font-size="9">KX-DDC-64</text>
  
  <rect x="285" y="595" width="100" height="25" rx="4" fill="#0D3A5C"/>
  <text x="335" y="612" text-anchor="middle" class="label-white" font-size="9">KX-DDC-128</text>
  
  <rect x="400" y="595" width="90" height="25" rx="4" fill="#0D3A5C"/>
  <text x="445" y="612" text-anchor="middle" class="label-white" font-size="9">KX-EIO</text>
  
  <rect x="505" y="595" width="110" height="25" rx="4" fill="#0D3A5C"/>
  <text x="560" y="612" text-anchor="middle" class="label-white" font-size="9">KX-200 Gateway</text>
  
  <rect x="630" y="595" width="100" height="25" rx="4" fill="#0D3A5C"/>
  <text x="680" y="612" text-anchor="middle" class="label-white" font-size="9">3rd Party BACnet</text>
  
  <rect x="745" y="595" width="110" height="25" rx="4" fill="#0D3A5C"/>
  <text x="800" y="612" text-anchor="middle" class="label-white" font-size="9">Sensors/Actuators</text>
  
  <!-- Vertical Connectors -->
  <line x1="130" y1="155" x2="130" y2="190" class="connector"/>
  <line x1="300" y1="155" x2="300" y2="190" class="connector"/>
  <line x1="470" y1="155" x2="470" y2="190" class="connector"/>
  
  <line x1="110" y1="260" x2="110" y2="320" class="connector"/>
  <line x1="255" y1="260" x2="255" y2="320" class="connector"/>
  <line x1="400" y1="260" x2="400" y2="320" class="connector"/>
  <line x1="545" y1="260" x2="545" y2="320" class="connector"/>
  <line x1="690" y1="260" x2="690" y2="320" class="connector"/>
  
  <line x1="290" y1="415" x2="290" y2="450" class="connector"/>
  <line x1="642" y1="415" x2="642" y2="450" class="connector-data"/>
  <line x1="802" y1="415" x2="802" y2="450" class="connector"/>
  
  <line x1="335" y1="540" x2="335" y2="560" class="connector"/>
  <line x1="560" y1="540" x2="560" y2="560" class="connector"/>
  <line x1="802" y1="540" x2="802" y2="560" class="connector"/>
  
</svg>