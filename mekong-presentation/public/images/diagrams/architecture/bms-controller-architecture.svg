<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #0A2240; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #555; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #333; }
      .label-white { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #FFF; }
      .label-sm { font-family: 'Segoe UI', Arial, sans-serif; font-size: 9px; fill: #666; }
      .label-xs { font-family: 'Segoe UI', Arial, sans-serif; font-size: 8px; fill: #888; }
      .box-primary { fill: #0A2240; }
      .box-accent { fill: #FF6B00; }
      .box-light { fill: #E8EDF2; stroke: #B8C4D0; stroke-width: 1; }
      .box-white { fill: #FFFFFF; stroke: #D0D8E0; stroke-width: 1; }
      .box-hvac { fill: #00BCD4; }
      .box-lighting { fill: #FFC107; }
      .box-power { fill: #4CAF50; }
      .box-security { fill: #9C27B0; }
      .connector { stroke: #0A2240; stroke-width: 2; fill: none; }
      .connector-bus { stroke: #FF6B00; stroke-width: 3; fill: none; }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FAFBFC"/>
      <stop offset="100%" style="stop-color:#EEF1F5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0A2240"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="650" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" class="title">BMS CONTROLLER ARCHITECTURE</text>
  <text x="450" y="52" text-anchor="middle" class="subtitle">KX-DDC Series — Direct Digital Controller for Building Automation</text>
  
  <!-- SUPERVISION LEVEL -->
  <rect x="30" y="75" width="840" height="90" rx="8" class="box-light" filter="url(#shadow)"/>
  <rect x="30" y="75" width="840" height="28" rx="8" fill="#2196F3"/>
  <rect x="30" y="95" width="840" height="8" fill="#2196F3"/>
  <text x="450" y="94" text-anchor="middle" class="label-white">MANAGEMENT LEVEL — KinexusBMS Server</text>
  
  <!-- Server components -->
  <rect x="60" y="115" width="120" height="35" rx="5" class="box-white" filter="url(#shadow)"/>
  <text x="120" y="137" text-anchor="middle" class="label">BMS Server</text>
  
  <rect x="200" y="115" width="120" height="35" rx="5" class="box-white" filter="url(#shadow)"/>
  <text x="260" y="137" text-anchor="middle" class="label">Workstation</text>
  
  <rect x="340" y="115" width="120" height="35" rx="5" class="box-white" filter="url(#shadow)"/>
  <text x="400" y="137" text-anchor="middle" class="label">Web Dashboard</text>
  
  <rect x="480" y="115" width="120" height="35" rx="5" class="box-white" filter="url(#shadow)"/>
  <text x="540" y="137" text-anchor="middle" class="label">Mobile App</text>
  
  <rect x="620" y="115" width="110" height="35" rx="5" class="box-white" filter="url(#shadow)"/>
  <text x="675" y="137" text-anchor="middle" class="label">Historian DB</text>
  
  <rect x="750" y="115" width="100" height="35" rx="5" class="box-white" filter="url(#shadow)"/>
  <text x="800" y="137" text-anchor="middle" class="label">Analytics</text>
  
  <!-- NETWORK BUS -->
  <rect x="80" y="185" width="740" height="25" rx="5" class="box-accent"/>
  <text x="450" y="202" text-anchor="middle" class="label-white">BACnet IP / Modbus TCP — Ethernet Network</text>
  
  <!-- Vertical connectors from server -->
  <line x1="120" y1="150" x2="120" y2="185" class="connector"/>
  <line x1="260" y1="150" x2="260" y2="185" class="connector"/>
  <line x1="400" y1="150" x2="400" y2="185" class="connector"/>
  
  <!-- CONTROLLER LEVEL -->
  <rect x="30" y="230" width="840" height="170" rx="8" class="box-light" filter="url(#shadow)"/>
  <rect x="30" y="230" width="840" height="28" rx="8" class="box-primary"/>
  <rect x="30" y="250" width="840" height="8" class="box-primary"/>
  <text x="450" y="249" text-anchor="middle" class="label-white">AUTOMATION LEVEL — KX-DDC Controllers</text>
  
  <!-- DDC-24 -->
  <rect x="60" y="275" width="170" height="110" rx="6" class="box-white" filter="url(#shadow)"/>
  <rect x="60" y="275" width="170" height="22" rx="6" class="box-primary"/>
  <rect x="60" y="292" width="170" height="5" class="box-primary"/>
  <text x="145" y="291" text-anchor="middle" class="label-white">KX-DDC-24</text>
  <text x="145" y="315" text-anchor="middle" class="label">24 I/O Points</text>
  <text x="75" y="335" class="label-sm">• 12 UI (0-10V, 4-20mA)</text>
  <text x="75" y="350" class="label-sm">• 8 DI (Dry contact)</text>
  <text x="75" y="365" class="label-sm">• 4 AO (0-10V)</text>
  <text x="75" y="380" class="label-sm">• BACnet MS/TP + IP</text>
  
  <!-- DDC-64 -->
  <rect x="260" y="275" width="170" height="110" rx="6" class="box-white" filter="url(#shadow)"/>
  <rect x="260" y="275" width="170" height="22" rx="6" class="box-accent"/>
  <rect x="260" y="292" width="170" height="5" class="box-accent"/>
  <text x="345" y="291" text-anchor="middle" class="label-white">KX-DDC-64</text>
  <text x="345" y="315" text-anchor="middle" class="label">64 I/O Points</text>
  <text x="275" y="335" class="label-sm">• 24 UI (Universal)</text>
  <text x="275" y="350" class="label-sm">• 24 DI + 8 DO</text>
  <text x="275" y="365" class="label-sm">• 8 AO (0-10V)</text>
  <text x="275" y="380" class="label-sm">• BACnet IP + Modbus</text>
  
  <!-- DDC-128 -->
  <rect x="460" y="275" width="170" height="110" rx="6" class="box-white" filter="url(#shadow)"/>
  <rect x="460" y="275" width="170" height="22" rx="6" class="box-primary"/>
  <rect x="460" y="292" width="170" height="5" class="box-primary"/>
  <text x="545" y="291" text-anchor="middle" class="label-white">KX-DDC-128</text>
  <text x="545" y="315" text-anchor="middle" class="label">128 I/O Points</text>
  <text x="475" y="335" class="label-sm">• 48 UI (Universal)</text>
  <text x="475" y="350" class="label-sm">• 48 DI + 16 DO</text>
  <text x="475" y="365" class="label-sm">• 16 AO (0-10V)</text>
  <text x="475" y="380" class="label-sm">• Dual Ethernet + RS485</text>
  
  <!-- I/O Expansion -->
  <rect x="660" y="275" width="170" height="110" rx="6" class="box-white" filter="url(#shadow)"/>
  <rect x="660" y="275" width="170" height="22" rx="6" fill="#4CAF50"/>
  <rect x="660" y="292" width="170" height="5" fill="#4CAF50"/>
  <text x="745" y="291" text-anchor="middle" class="label-white">KX-EIO Modules</text>
  <text x="745" y="315" text-anchor="middle" class="label">I/O Expansion</text>
  <text x="675" y="335" class="label-sm">• EIO-DI16: 16 Digital In</text>
  <text x="675" y="350" class="label-sm">• EIO-DO16: 16 Digital Out</text>
  <text x="675" y="365" class="label-sm">• EIO-UI8: 8 Universal</text>
  <text x="675" y="380" class="label-sm">• EIO-AO4: 4 Analog Out</text>
  
  <!-- Vertical connectors to DDC -->
  <line x1="145" y1="210" x2="145" y2="275" class="connector"/>
  <line x1="345" y1="210" x2="345" y2="275" class="connector"/>
  <line x1="545" y1="210" x2="545" y2="275" class="connector"/>
  <line x1="745" y1="210" x2="745" y2="275" class="connector"/>
  
  <!-- RS485 BUS -->
  <rect x="80" y="410" width="740" height="20" rx="5" fill="#4CAF50"/>
  <text x="450" y="424" text-anchor="middle" class="label-white" font-size="10">RS-485 BACnet MS/TP Field Bus</text>
  
  <!-- FIELD LEVEL -->
  <rect x="30" y="450" width="840" height="180" rx="8" class="box-light" filter="url(#shadow)"/>
  <rect x="30" y="450" width="840" height="28" rx="8" fill="#607D8B"/>
  <rect x="30" y="470" width="840" height="8" fill="#607D8B"/>
  <text x="450" y="469" text-anchor="middle" class="label-white">FIELD LEVEL — Sensors, Actuators, Equipment</text>
  
  <!-- HVAC Section -->
  <rect x="50" y="495" width="190" height="120" rx="5" stroke="#00BCD4" stroke-width="2" fill="#E0F7FA"/>
  <rect x="50" y="495" width="190" height="20" rx="5" class="box-hvac"/>
  <text x="145" y="509" text-anchor="middle" class="label-white" font-size="10">HVAC</text>
  <text x="60" y="530" class="label-sm">• Temperature Sensors</text>
  <text x="60" y="545" class="label-sm">• Humidity Sensors</text>
  <text x="60" y="560" class="label-sm">• CO2 Sensors</text>
  <text x="60" y="575" class="label-sm">• VAV Dampers</text>
  <text x="60" y="590" class="label-sm">• AHU/FCU Control</text>
  <text x="60" y="605" class="label-sm">• Chiller Interface</text>
  
  <!-- Lighting Section -->
  <rect x="260" y="495" width="150" height="120" rx="5" stroke="#FFC107" stroke-width="2" fill="#FFF8E1"/>
  <rect x="260" y="495" width="150" height="20" rx="5" class="box-lighting"/>
  <text x="335" y="509" text-anchor="middle" class="label-white" font-size="10">LIGHTING</text>
  <text x="270" y="530" class="label-sm">• Occupancy Sensors</text>
  <text x="270" y="545" class="label-sm">• Light Level Sensors</text>
  <text x="270" y="560" class="label-sm">• DALI Controllers</text>
  <text x="270" y="575" class="label-sm">• Dimmer Modules</text>
  <text x="270" y="590" class="label-sm">• Schedule Control</text>
  
  <!-- Power Section -->
  <rect x="430" y="495" width="150" height="120" rx="5" stroke="#4CAF50" stroke-width="2" fill="#E8F5E9"/>
  <rect x="430" y="495" width="150" height="20" rx="5" class="box-power"/>
  <text x="505" y="509" text-anchor="middle" class="label-white" font-size="10">POWER</text>
  <text x="440" y="530" class="label-sm">• Power Meters</text>
  <text x="440" y="545" class="label-sm">• Current Sensors</text>
  <text x="440" y="560" class="label-sm">• UPS Monitoring</text>
  <text x="440" y="575" class="label-sm">• Generator Control</text>
  <text x="440" y="590" class="label-sm">• PV System Interface</text>
  
  <!-- Security Section -->
  <rect x="600" y="495" width="150" height="120" rx="5" stroke="#9C27B0" stroke-width="2" fill="#F3E5F5"/>
  <rect x="600" y="495" width="150" height="20" rx="5" class="box-security"/>
  <text x="675" y="509" text-anchor="middle" class="label-white" font-size="10">ACCESS</text>
  <text x="610" y="530" class="label-sm">• Card Readers</text>
  <text x="610" y="545" class="label-sm">• Door Contacts</text>
  <text x="610" y="560" class="label-sm">• Lock Control</text>
  <text x="610" y="575" class="label-sm">• Elevator Interface</text>
  <text x="610" y="590" class="label-sm">• Parking System</text>
  
  <!-- Fire Section -->
  <rect x="770" y="495" width="90" height="120" rx="5" stroke="#F44336" stroke-width="2" fill="#FFEBEE"/>
  <rect x="770" y="495" width="90" height="20" rx="5" fill="#F44336"/>
  <text x="815" y="509" text-anchor="middle" class="label-white" font-size="10">FIRE</text>
  <text x="780" y="530" class="label-sm">• Smoke Det.</text>
  <text x="780" y="545" class="label-sm">• Heat Det.</text>
  <text x="780" y="560" class="label-sm">• Fire Panel</text>
  <text x="780" y="575" class="label-sm">• Monitor</text>
  
  <!-- Connectors field to bus -->
  <line x1="145" y1="430" x2="145" y2="495" class="connector"/>
  <line x1="335" y1="430" x2="335" y2="495" class="connector"/>
  <line x1="505" y1="430" x2="505" y2="495" class="connector"/>
  <line x1="675" y1="430" x2="675" y2="495" class="connector"/>
  <line x1="815" y1="430" x2="815" y2="495" class="connector"/>
  
</svg>