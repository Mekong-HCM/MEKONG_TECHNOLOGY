<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #0A2240; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #555; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #333; }
      .label-white { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #FFF; }
      .label-sm { font-family: 'Segoe UI', Arial, sans-serif; font-size: 9px; fill: #666; }
      .label-port { font-family: 'Segoe UI', Arial, sans-serif; font-size: 8px; fill: #FFF; font-weight: 600; }
      .gateway-body { fill: #0A2240; }
      .gateway-accent { fill: #FF6B00; }
      .port-serial { fill: #4CAF50; }
      .port-ethernet { fill: #2196F3; }
      .port-power { fill: #F44336; }
      .port-usb { fill: #9C27B0; }
      .device-box { fill: #FFFFFF; stroke: #D0D8E0; stroke-width: 1.5; }
      .wire { stroke-width: 2; fill: none; }
      .wire-rs485 { stroke: #4CAF50; }
      .wire-ethernet { stroke: #2196F3; }
      .wire-power { stroke: #F44336; stroke-dasharray: 8,4; }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FAFBFC"/>
      <stop offset="100%" style="stop-color:#EEF1F5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4CAF50"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2196F3"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="550" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" class="title">KX-200 IoT GATEWAY — CONNECTION DIAGRAM</text>
  <text x="450" y="50" text-anchor="middle" class="subtitle">Typical Application with Multi-Protocol Field Devices</text>
  
  <!-- GATEWAY DEVICE (CENTER) -->
  <g transform="translate(320, 140)">
    <!-- Main body -->
    <rect x="0" y="0" width="260" height="150" rx="8" class="gateway-body" filter="url(#shadow)"/>
    
    <!-- Orange accent stripe -->
    <rect x="0" y="8" width="260" height="12" class="gateway-accent"/>
    
    <!-- Product label -->
    <rect x="80" y="35" width="100" height="30" rx="4" fill="#1A3A5C"/>
    <text x="130" y="55" text-anchor="middle" class="label-white" font-size="14" font-weight="600">KX-200</text>
    
    <!-- Status LEDs -->
    <circle cx="30" cy="45" r="6" fill="#4CAF50"/>
    <circle cx="50" cy="45" r="6" fill="#4CAF50"/>
    <circle cx="70" cy="45" r="6" fill="#FFC107"/>
    <text x="50" y="60" text-anchor="middle" class="label-sm" fill="#AAA">PWR NET DATA</text>
    
    <!-- RS-485 Ports (bottom) -->
    <rect x="15" y="110" width="50" height="25" rx="3" class="port-serial"/>
    <text x="40" y="127" text-anchor="middle" class="label-port">RS485-1</text>
    
    <rect x="75" y="110" width="50" height="25" rx="3" class="port-serial"/>
    <text x="100" y="127" text-anchor="middle" class="label-port">RS485-2</text>
    
    <rect x="135" y="110" width="50" height="25" rx="3" class="port-serial"/>
    <text x="160" y="127" text-anchor="middle" class="label-port">RS485-3</text>
    
    <rect x="195" y="110" width="50" height="25" rx="3" class="port-serial"/>
    <text x="220" y="127" text-anchor="middle" class="label-port">RS485-4</text>
    
    <!-- Ethernet Ports (side) -->
    <rect x="0" y="70" width="12" height="30" rx="2" class="port-ethernet"/>
    <text x="-5" y="90" text-anchor="end" class="label-sm" fill="#2196F3">ETH1</text>
    
    <rect x="248" y="70" width="12" height="30" rx="2" class="port-ethernet"/>
    <text x="265" y="90" text-anchor="start" class="label-sm" fill="#2196F3">ETH2</text>
    
    <!-- USB Port -->
    <rect x="200" y="40" width="40" height="15" rx="2" class="port-usb"/>
    <text x="220" y="52" text-anchor="middle" class="label-port">USB</text>
  </g>
  
  <!-- POWER SUPPLY -->
  <rect x="30" y="180" width="100" height="60" rx="6" class="device-box" filter="url(#shadow)"/>
  <rect x="30" y="180" width="100" height="18" rx="6" class="port-power"/>
  <text x="80" y="194" text-anchor="middle" class="label-white" font-size="9">24V DC PSU</text>
  <text x="80" y="217" text-anchor="middle" class="label">Power Supply</text>
  <text x="80" y="232" text-anchor="middle" class="label-sm">24V DC / 2A</text>
  
  <!-- Power wire -->
  <path d="M130 210 L310 210 L310 215 L320 215" class="wire wire-power"/>
  
  <!-- CLOUD/SERVER (TOP RIGHT) -->
  <rect x="680" y="80" width="180" height="80" rx="8" fill="#E3F2FD" stroke="#2196F3" stroke-width="2" filter="url(#shadow)"/>
  <text x="770" y="105" text-anchor="middle" class="label" fill="#1565C0">☁️ Cloud / Server</text>
  <text x="770" y="125" text-anchor="middle" class="label-sm">KinexusBMS Platform</text>
  <text x="770" y="140" text-anchor="middle" class="label-sm">MQTT / HTTP / WebSocket</text>
  
  <!-- Ethernet to cloud -->
  <path d="M580 185 L620 185 L620 120 L680 120" class="wire wire-ethernet" marker-end="url(#arrow-blue)"/>
  
  <!-- LOCAL HMI (TOP LEFT) -->
  <rect x="30" y="80" width="120" height="60" rx="6" class="device-box" filter="url(#shadow)"/>
  <rect x="30" y="80" width="120" height="18" rx="6" class="port-ethernet"/>
  <text x="90" y="94" text-anchor="middle" class="label-white" font-size="9">HMI / SCADA</text>
  <text x="90" y="117" text-anchor="middle" class="label">Local Workstation</text>
  <text x="90" y="132" text-anchor="middle" class="label-sm">Ethernet TCP/IP</text>
  
  <!-- Ethernet to HMI -->
  <path d="M320 215 L280 215 L280 110 L150 110" class="wire wire-ethernet" marker-end="url(#arrow-blue)"/>
  
  <!-- FIELD DEVICES (BOTTOM) -->
  
  <!-- Modbus Sensors Group -->
  <rect x="50" y="350" width="160" height="130" rx="6" stroke="#4CAF50" stroke-width="2" fill="#E8F5E9" filter="url(#shadow)"/>
  <rect x="50" y="350" width="160" height="22" rx="6" class="port-serial"/>
  <text x="130" y="366" text-anchor="middle" class="label-white">RS485-1: Modbus RTU</text>
  
  <rect x="65" y="385" width="60" height="35" rx="4" class="device-box"/>
  <text x="95" y="400" text-anchor="middle" class="label-sm">Temp</text>
  <text x="95" y="412" text-anchor="middle" class="label-sm">Sensor</text>
  
  <rect x="135" y="385" width="60" height="35" rx="4" class="device-box"/>
  <text x="165" y="400" text-anchor="middle" class="label-sm">Humidity</text>
  <text x="165" y="412" text-anchor="middle" class="label-sm">Sensor</text>
  
  <rect x="65" y="430" width="60" height="35" rx="4" class="device-box"/>
  <text x="95" y="445" text-anchor="middle" class="label-sm">Power</text>
  <text x="95" y="457" text-anchor="middle" class="label-sm">Meter</text>
  
  <rect x="135" y="430" width="60" height="35" rx="4" class="device-box"/>
  <text x="165" y="445" text-anchor="middle" class="label-sm">Flow</text>
  <text x="165" y="457" text-anchor="middle" class="label-sm">Meter</text>
  
  <!-- Wire RS485-1 -->
  <path d="M360 290 L360 320 L130 320 L130 350" class="wire wire-rs485" marker-end="url(#arrow-green)"/>
  
  <!-- BACnet Devices Group -->
  <rect x="240" y="350" width="160" height="130" rx="6" stroke="#4CAF50" stroke-width="2" fill="#E8F5E9" filter="url(#shadow)"/>
  <rect x="240" y="350" width="160" height="22" rx="6" class="port-serial"/>
  <text x="320" y="366" text-anchor="middle" class="label-white">RS485-2: BACnet MS/TP</text>
  
  <rect x="255" y="385" width="60" height="35" rx="4" class="device-box"/>
  <text x="285" y="400" text-anchor="middle" class="label-sm">VAV</text>
  <text x="285" y="412" text-anchor="middle" class="label-sm">Controller</text>
  
  <rect x="325" y="385" width="60" height="35" rx="4" class="device-box"/>
  <text x="355" y="400" text-anchor="middle" class="label-sm">AHU</text>
  <text x="355" y="412" text-anchor="middle" class="label-sm">Controller</text>
  
  <rect x="255" y="430" width="130" height="35" rx="4" class="device-box"/>
  <text x="320" y="452" text-anchor="middle" class="label-sm">Thermostat Zone 1-8</text>
  
  <!-- Wire RS485-2 -->
  <path d="M420 290 L420 320 L320 320 L320 350" class="wire wire-rs485" marker-end="url(#arrow-green)"/>
  
  <!-- VFD/Motor Group -->
  <rect x="430" y="350" width="160" height="130" rx="6" stroke="#4CAF50" stroke-width="2" fill="#E8F5E9" filter="url(#shadow)"/>
  <rect x="430" y="350" width="160" height="22" rx="6" class="port-serial"/>
  <text x="510" y="366" text-anchor="middle" class="label-white">RS485-3: Modbus RTU</text>
  
  <rect x="445" y="385" width="60" height="35" rx="4" class="device-box"/>
  <text x="475" y="400" text-anchor="middle" class="label-sm">VFD</text>
  <text x="475" y="412" text-anchor="middle" class="label-sm">Pump 1</text>
  
  <rect x="515" y="385" width="60" height="35" rx="4" class="device-box"/>
  <text x="545" y="400" text-anchor="middle" class="label-sm">VFD</text>
  <text x="545" y="412" text-anchor="middle" class="label-sm">Pump 2</text>
  
  <rect x="445" y="430" width="130" height="35" rx="4" class="device-box"/>
  <text x="510" y="452" text-anchor="middle" class="label-sm">VFD Fan Coil Units</text>
  
  <!-- Wire RS485-3 -->
  <path d="M480 290 L480 320 L510 320 L510 350" class="wire wire-rs485" marker-end="url(#arrow-green)"/>
  
  <!-- I/O Expansion Group -->
  <rect x="620" y="350" width="160" height="130" rx="6" stroke="#4CAF50" stroke-width="2" fill="#E8F5E9" filter="url(#shadow)"/>
  <rect x="620" y="350" width="160" height="22" rx="6" class="port-serial"/>
  <text x="700" y="366" text-anchor="middle" class="label-white">RS485-4: KX-EIO</text>
  
  <rect x="635" y="385" width="60" height="35" rx="4" class="device-box"/>
  <text x="665" y="400" text-anchor="middle" class="label-sm">EIO-DI16</text>
  <text x="665" y="412" text-anchor="middle" class="label-sm">16 DI</text>
  
  <rect x="705" y="385" width="60" height="35" rx="4" class="device-box"/>
  <text x="735" y="400" text-anchor="middle" class="label-sm">EIO-UI8</text>
  <text x="735" y="412" text-anchor="middle" class="label-sm">8 AI/DI</text>
  
  <rect x="635" y="430" width="60" height="35" rx="4" class="device-box"/>
  <text x="665" y="445" text-anchor="middle" class="label-sm">EIO-DO8</text>
  <text x="665" y="457" text-anchor="middle" class="label-sm">8 DO</text>
  
  <rect x="705" y="430" width="60" height="35" rx="4" class="device-box"/>
  <text x="735" y="445" text-anchor="middle" class="label-sm">EIO-AO4</text>
  <text x="735" y="457" text-anchor="middle" class="label-sm">4 AO</text>
  
  <!-- Wire RS485-4 -->
  <path d="M540 290 L540 320 L700 320 L700 350" class="wire wire-rs485" marker-end="url(#arrow-green)"/>
  
  <!-- Legend -->
  <rect x="30" y="500" width="300" height="35" rx="5" fill="#F5F5F5" stroke="#DDD"/>
  <text x="45" y="522" class="label">Legend:</text>
  <line x1="90" y1="517" x2="120" y2="517" class="wire wire-rs485" stroke-width="3"/>
  <text x="125" y="522" class="label-sm">RS-485 Serial</text>
  <line x1="185" y1="517" x2="215" y2="517" class="wire wire-ethernet" stroke-width="3"/>
  <text x="220" y="522" class="label-sm">Ethernet</text>
  <line x1="270" y1="517" x2="300" y2="517" class="wire wire-power" stroke-width="3"/>
  <text x="305" y="522" class="label-sm">Power</text>
  
</svg>